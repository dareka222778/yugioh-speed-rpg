name: M442 Armed Dragon TagDuel adapter
on:
  pull_request:
    paths:
      - 'src/armedDragonTagDuelAdapter.ts'
      - 'tests/armedDragonTagDuelAdapter.test.cjs'
      - 'docs/evidence/m442-armed-dragon-tag-duel-adapter.json'
      - '.github/workflows/m442-armed-dragon-tag-duel-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  armed-dragon-tag-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Run Armed Dragon TagDuel adapter behavior tests
        run: node --test tests/armedDragonTagDuelAdapter.test.cjs
