name: M413 Wicked Worm Beast End Phase return focused validation
on:
  pull_request:
    paths:
      - 'src/wickedWormBeast.ts'
      - 'tests/wickedWormBeast.test.cjs'
      - 'docs/evidence/m413-wicked-worm-beast.json'
      - '.github/workflows/m413-wicked-worm-beast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/wickedWormBeast.test.cjs
