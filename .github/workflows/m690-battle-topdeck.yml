name: M690 battle topdeck and hand-cycle adapter
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/battleTopdeckTagAdapter.ts
      - tests/battleTopdeckTagAdapter.test.cjs
      - docs/evidence/m690-battle-topdeck.json
      - scripts/audit-battle-topdeck-m690.cjs
      - .github/workflows/m690-battle-topdeck.yml
  push:
    branches:
      - feat/work-m690-battle-topdeck-20261127
jobs:
  battle-topdeck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/battleTopdeckTagAdapter.test.cjs
      - run: node scripts/audit-battle-topdeck-m690.cjs
