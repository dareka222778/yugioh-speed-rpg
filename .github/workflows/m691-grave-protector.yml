name: M691 Grave Protector battle destination replacement
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/graveProtectorBattleReplacementTagAdapter.ts
      - tests/graveProtectorBattleReplacementTagAdapter.test.cjs
      - docs/evidence/m691-grave-protector.json
      - scripts/audit-grave-protector-m691.cjs
      - .github/workflows/m691-grave-protector.yml
  push:
    branches:
      - feat/work-m691-grave-protector-20261127
jobs:
  grave-protector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/graveProtectorBattleReplacementTagAdapter.test.cjs
      - run: node scripts/audit-grave-protector-m691.cjs
