name: M461 TagDuel End Phase restart idempotency
on:
  push:
    branches:
      - feat/work-m461-tag-end-phase-restart-idempotency-20261121
    paths:
      - 'tests/tagDuelEndPhaseRestartIdempotency2v2.test.cjs'
      - 'docs/evidence/m461-tag-end-phase-restart-idempotency.json'
      - '.github/workflows/m461-tag-end-phase-restart-idempotency.yml'
  pull_request:
    paths:
      - 'tests/tagDuelEndPhaseRestartIdempotency2v2.test.cjs'
      - 'docs/evidence/m461-tag-end-phase-restart-idempotency.json'
      - '.github/workflows/m461-tag-end-phase-restart-idempotency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tagduel-end-phase-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m461-tag-end-phase-restart-idempotency.json', 'utf8'))"
      - name: Run TagDuel End Phase restart test
        run: node --test tests/tagDuelEndPhaseRestartIdempotency2v2.test.cjs
