name: M499 Tag Field Republish Command Contract
on:
  push:
    branches:
      - feat/work-m499-tag-field-republish-contract-20261122
    paths:
      - 'tests/tagFieldRepublishCommandContract.test.cjs'
      - 'docs/evidence/m499-tag-field-republish-command-contract.json'
      - '.github/workflows/m499-tag-field-republish-command-contract.yml'
  pull_request:
    paths:
      - 'tests/tagFieldRepublishCommandContract.test.cjs'
      - 'docs/evidence/m499-tag-field-republish-command-contract.json'
      - '.github/workflows/m499-tag-field-republish-command-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-field-republish-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m499-tag-field-republish-command-contract.json', 'utf8'))"
      - name: Run /dupla campo recovery contract
        run: node --test tests/tagFieldRepublishCommandContract.test.cjs
