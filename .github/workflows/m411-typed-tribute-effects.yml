name: M411 typed tribute effects focused validation

on:
  pull_request:
    paths:
      - 'src/typedTributeEffects.ts'
      - 'tests/typedTributeEffects.test.cjs'
      - 'docs/evidence/m411-typed-tribute-effects.json'
      - '.github/workflows/m411-typed-tribute-effects.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/typedTributeEffects.test.cjs
