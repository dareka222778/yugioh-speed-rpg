name: M387 A-Team Trap Disposal focused validation

on:
  pull_request:
    paths:
      - 'src/aTeamTrapDisposal.ts'
      - 'tests/aTeamTrapDisposal.test.cjs'
      - '.github/workflows/m387-a-team-trap-disposal-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/aTeamTrapDisposal.test.cjs
