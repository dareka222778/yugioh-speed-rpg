name: M633 Dark Scorpion Battle Damage Adapter
on:
  push:
    branches:
      - feat/work-m633-dark-scorpion-battle-damage-20261125
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/darkScorpionBattleDamageTagAdapter.ts
      - tests/darkScorpionBattleDamageTagAdapter.test.cjs
      - docs/evidence/m633-dark-scorpion-battle-damage.json
      - .github/workflows/m633-dark-scorpion-battle-damage.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate evidence
        run: node -e "const e=require('./docs/evidence/m633-dark-scorpion-battle-damage.json'); if(e.format!==1 || e.mission!=='M633' || e.cards.length!==2 || e.verification.newCertifications!==0 || e.verification.inventoryGranted!==0) process.exit(1)"
      - run: node --test tests/darkScorpionBattleDamageTagAdapter.test.cjs
