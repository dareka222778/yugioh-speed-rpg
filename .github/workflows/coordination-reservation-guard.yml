name: Coordination reservation guard

on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - scripts/coordination-reservation-guard.cjs
      - tests/coordinationReservationGuard.test.cjs
      - .github/workflows/coordination-reservation-guard.yml
      - coordination/state.json
      - coordination/runs/**
  push:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - coordination/state.json
      - coordination/runs/**

permissions:
  contents: read

jobs:
  reservation-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run guard unit tests
        run: node --test tests/coordinationReservationGuard.test.cjs
      - name: Verify PR contains the current shared branch HEAD
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_BRANCH"
          base_head="$(git rev-parse FETCH_HEAD)"
          pr_head="$(git rev-parse HEAD^2)"
          if ! git merge-base --is-ancestor "$base_head" "$pr_head"; then
            echo "PR branch is behind the current shared branch; synchronize without force."
            exit 1
          fi
      - name: Validate the latest registered checkpoint
        shell: bash
        run: |
          run_file="$(node -p "require('./coordination/state.json').lastCheckpoint || ''")"
          test -n "$run_file"
          test -f "$run_file"
          node scripts/coordination-reservation-guard.cjs \
            --state coordination/state.json \
            --run-file "$run_file"
