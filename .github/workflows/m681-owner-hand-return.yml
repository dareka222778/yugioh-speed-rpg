name: M681 Physical-owner hand-return TagDuel adapters
on:
  push:
    branches:
      - feat/work-m681-owner-hand-return-20261127
    paths:
      - 'src/ownerHandReturnTagAdapter.ts'
      - 'tests/ownerHandReturnTagAdapter.test.cjs'
      - 'docs/evidence/m681-owner-hand-return.json'
      - 'scripts/audit-owner-hand-return-m681.cjs'
      - '.github/workflows/m681-owner-hand-return.yml'
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'src/ownerHandReturnTagAdapter.ts'
      - 'tests/ownerHandReturnTagAdapter.test.cjs'
      - 'docs/evidence/m681-owner-hand-return.json'
      - 'scripts/audit-owner-hand-return-m681.cjs'
      - '.github/workflows/m681-owner-hand-return.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node scripts/audit-owner-hand-return-m681.cjs
      - run: node scripts/run-tests-isolated.cjs tests/ownerHandReturnTagAdapter.test.cjs
