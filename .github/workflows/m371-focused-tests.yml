name: M371 Discord battle redirection integration
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'tests/tagBattleDamageRedirectDiscord2v2.test.cjs'
      - '.github/workflows/m371-focused-tests.yml'
jobs:
  m371-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests-isolated.cjs tests/tagBattleDamageRedirectDiscord2v2.test.cjs
