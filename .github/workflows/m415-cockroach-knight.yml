name: M415 Cockroach Knight GY trigger focused validation
on:
  pull_request:
    paths:
      - 'src/cockroachKnight.ts'
      - 'tests/cockroachKnight.test.cjs'
      - 'docs/evidence/m415-cockroach-knight.json'
      - '.github/workflows/m415-cockroach-knight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/cockroachKnight.test.cjs
