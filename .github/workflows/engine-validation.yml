name: Engine validation
on:
  push:
    branches: [classic-engine-foundation]
  pull_request:
    branches: [main, classic-engine-foundation]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-resolver-archives.cjs
      - run: node scripts/check-mission3-integrity.cjs
      - run: node scripts/check-mission4-integrity.cjs
      - run: node scripts/check-mission5-integrity.cjs
      - run: node scripts/check-mission7-integrity.cjs
      - run: node scripts/check-mission8-integrity.cjs
      - run: npm run check
      - run: npm test
      - run: node scripts/verify-catalog-revisions.cjs
      - run: node scripts/stamp-candidate-build.cjs
      - run: node scripts/audit-certification-pipeline.cjs docs/evidence/mission4-individual-reviews.json artifacts/certification-executions-mission4.json
      - run: node scripts/audit-certification-pipeline.cjs docs/evidence/mission7-individual-reviews.json artifacts/certification-executions-mission7.json
      - run: node scripts/audit-certification-pipeline.cjs docs/evidence/mission8-individual-reviews.json artifacts/certification-executions-mission8.json
      - run: node scripts/audit-certification-pipeline.cjs docs/evidence/mission8-fusion-reviews.json artifacts/certification-executions-fusion8.json
      - run: node scripts/audit-normal-expansion9.cjs
      - run: node scripts/audit-fusion-expansion10.cjs
      - run: node scripts/audit-mechanical-batch11.cjs
      - run: node scripts/audit-normalization-blockers.cjs
      - run: node scripts/audit-certification-pipeline.cjs docs/evidence/mission5-individual-reviews.json artifacts/certification-executions-mission5.json
      - run: node scripts/stress-persisted-duels.cjs 50 4 --eager
      - run: node scripts/stress-persisted-duels.cjs 50 4
      - run: node scripts/stress-persisted-duels.cjs 50 2
      - run: node scripts/stress-persisted-duels.cjs 100 2
      - run: node scripts/stress-persisted-duels.cjs 8 2 --mixed
      - run: node scripts/stress-persisted-duels.cjs 16 2 --mixed
      - run: node scripts/audit-mission7-beta.cjs
      - run: node scripts/stress-persisted-duels.cjs 50 2 --mixed
      - run: node scripts/stress-persisted-duels.cjs 100 2 --mixed
      - run: node --expose-gc scripts/soak-mixed-versions.cjs 120
      - run: npm run audit:rea
      - run: node --expose-gc scripts/benchmark-continuous8.cjs
      - run: npm run benchmark:recovery
      - run: node --expose-gc scripts/benchmark-concurrent-engine.cjs
      - run: node --expose-gc scripts/benchmark-concurrent-engine.cjs 50
      - run: node --expose-gc scripts/benchmark-concurrent-engine.cjs 100
      - run: npm run audit:historical-batch
      - run: npm run check:cards
      - run: npm run audit:history
      - run: npm run audit:cards:matrix
      - run: node scripts/plan-mission8-followups.cjs
      - run: npm run coverage:engine
      - run: npm run progress
      - run: npm run audit:engine
      - run: npm run accept:engine
      - run: npm run audit:tag
      - run: npm run audit:tag-sessions
      - run: npm run audit:tag-classic
      - run: npm run audit:tag-classic-sessions
      - run: npm run audit:tag-training
      - run: node scripts/render-previews.cjs artifacts/previews
      - run: node scripts/audit-mission6-readiness.cjs
      - name: Preserve executable REA acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-acceptance-results
          path: |
            artifacts/rea-acceptance.json
            artifacts/engine-recovery-benchmark.json
            artifacts/discord-offline-homologation.json
            artifacts/concurrent-engine-benchmark.json
            artifacts/concurrent-engine-benchmark-*.json
            artifacts/certification-pipeline.json
            artifacts/certification-executions-mission4.json
            artifacts/discord-full-matches.json
            artifacts/persisted-duel-stress-*.json
            artifacts/certification-executions-mission5.json
            artifacts/normalization-blockers-mission5.json
            artifacts/abrupt-recovery-mission6.json
            artifacts/mixed-version-soak-mission6.json
            artifacts/readiness-mission6.json
            artifacts/certification-executions-mission7.json
            artifacts/certification-executions-mission8.json
            artifacts/certification-executions-fusion8.json
            artifacts/certification-executions-mission9*.json
            artifacts/mission9-normal-audit.json
            artifacts/certification-executions-fusion10.json
            artifacts/mission10-fusion-audit.json
            artifacts/certification-executions-mission11.json
            artifacts/mission11-mechanical-audit.json
            artifacts/continuous-benchmark-mission8.json
            artifacts/mission8-next-families.json
            artifacts/beta-simulation-mission7.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publicar prévias visuais
        uses: actions/upload-artifact@v4
        with:
          name: speed-rpg-visual-previews
          path: artifacts/previews
          if-no-files-found: error
          retention-days: 14
  extended-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-resolver-archives.cjs
      - run: node --expose-gc scripts/soak-mixed-versions.cjs 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-version-extended-soak
          path: artifacts/mixed-version-soak-mission6.json
          if-no-files-found: error
          retention-days: 14
