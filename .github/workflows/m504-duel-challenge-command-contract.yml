name: M504 1v1 Duel Challenge Command Contract
on:
  push:
    branches:
      - feat/work-m504-duel-challenge-command-contract-20261122
    paths:
      - 'tests/duelChallengeCommandContract.test.cjs'
      - 'docs/evidence/m504-duel-challenge-command-contract.json'
      - '.github/workflows/m504-duel-challenge-command-contract.yml'
  pull_request:
    paths:
      - 'tests/duelChallengeCommandContract.test.cjs'
      - 'docs/evidence/m504-duel-challenge-command-contract.json'
      - '.github/workflows/m504-duel-challenge-command-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duel-challenge-command-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m504-duel-challenge-command-contract.json', 'utf8'))"
      - name: Run /duelo desafiar command contract
        run: node --test tests/duelChallengeCommandContract.test.cjs
