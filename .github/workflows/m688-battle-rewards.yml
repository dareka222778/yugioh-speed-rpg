name: M688 battle reward behavior adapter
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/battleRewardTagAdapter.ts
      - tests/battleRewardTagAdapter.test.cjs
      - docs/evidence/m688-battle-rewards.json
      - scripts/audit-battle-rewards-m688.cjs
      - .github/workflows/m688-battle-rewards.yml
  push:
    branches:
      - feat/work-m688-battle-rewards-20261127
jobs:
  battle-rewards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/battleRewardTagAdapter.test.cjs
      - run: node scripts/audit-battle-rewards-m688.cjs
