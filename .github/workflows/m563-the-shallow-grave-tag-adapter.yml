name: M563 The Shallow Grave TagDuel adapter
on:
  push:
    branches:
      - feat/work-m563-the-shallow-grave-tag-adapter-20261123
    paths:
      - 'src/theShallowGraveTagAdapter.ts'
      - 'tests/theShallowGraveTagAdapter.test.cjs'
      - 'docs/evidence/m563-the-shallow-grave-tag-adapter.json'
      - '.github/workflows/m563-the-shallow-grave-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/theShallowGraveTagAdapter.ts'
      - 'tests/theShallowGraveTagAdapter.test.cjs'
      - 'docs/evidence/m563-the-shallow-grave-tag-adapter.json'
      - '.github/workflows/m563-the-shallow-grave-tag-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  the-shallow-grave:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m563-the-shallow-grave-tag-adapter.json', 'utf8'))"
      - name: Run M563 behavior regressions
        run: node --test tests/theShallowGraveTagAdapter.test.cjs
