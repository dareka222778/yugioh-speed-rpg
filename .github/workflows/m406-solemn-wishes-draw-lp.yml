name: M406 Solemn Wishes Draw LP
on:
  push:
    branches:
      - feat/work-m406-solemn-wishes-draw-lp-20261120
  pull_request:
    paths:
      - "src/solemnWishesDrawGain.ts"
      - "tests/solemnWishesDrawGain.test.cjs"
      - "docs/evidence/m406-solemn-wishes-draw-lp.json"
      - ".github/workflows/m406-solemn-wishes-draw-lp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/solemnWishesDrawGain.test.cjs
