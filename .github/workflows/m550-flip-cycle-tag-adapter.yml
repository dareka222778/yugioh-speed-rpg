name: M550 Flip Cycle TagDuel adapter
on:
  push:
    branches:
      - feat/work-m550-flip-cycle-tag-adapter-20261123
    paths:
      - 'src/flipCycleTagAdapter.ts'
      - 'tests/flipCycleTagAdapter.test.cjs'
      - 'docs/evidence/m550-flip-cycle-tag-adapter.json'
      - '.github/workflows/m550-flip-cycle-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/flipCycleTagAdapter.ts'
      - 'tests/flipCycleTagAdapter.test.cjs'
      - 'docs/evidence/m550-flip-cycle-tag-adapter.json'
      - '.github/workflows/m550-flip-cycle-tag-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flip-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m550-flip-cycle-tag-adapter.json', 'utf8'))"
      - name: Run M550 flip-cycle regressions
        run: node --test tests/flipCycleTagAdapter.test.cjs
