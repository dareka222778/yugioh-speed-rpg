name: M603 Swift Gaia no-Tribute Normal Summon adapter
on:
  push:
    branches:
      - feat/work-m603-swift-gaia-normal-summon-20261124
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/swiftGaiaNormalSummonTagAdapter.ts
      - tests/swiftGaiaNormalSummonTagAdapter.test.cjs
      - docs/evidence/m603-swift-gaia-normal-summon.json
      - .github/workflows/m603-swift-gaia-normal-summon.yml
permissions:
  contents: read
jobs:
  swift-gaia-normal-summon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m603-swift-gaia-normal-summon.json', 'utf8'))"
      - run: node --test tests/swiftGaiaNormalSummonTagAdapter.test.cjs
