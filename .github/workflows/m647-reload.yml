name: M647 Reload TagDuel adapter
on:
  push:
    branches:
      - feat/work-m647-reload-tag-adapter-20261126
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/reloadTagAdapter.ts
      - tests/reloadTagAdapter.test.cjs
      - docs/evidence/m647-reload.json
      - .github/workflows/m647-reload.yml
permissions:
  contents: read
jobs:
  reload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node -e "const e=JSON.parse(require('node:fs').readFileSync('docs/evidence/m647-reload.json','utf8')); if(e.mission!=='M647'||e.verification.focusedTests!==22||e.verification.behaviorCertifiedCards!==0) process.exit(1)"
      - run: node --test tests/reloadTagAdapter.test.cjs
