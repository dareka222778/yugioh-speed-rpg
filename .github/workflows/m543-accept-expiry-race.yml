name: M543 Accept Expiry Race
on:
  push:
    branches:
      - feat/work-m543-accept-expiry-race-20261123
    paths:
      - 'tests/acceptExpiryRace.test.cjs'
      - 'docs/evidence/m543-accept-expiry-race.json'
      - '.github/workflows/m543-accept-expiry-race.yml'
  pull_request:
    paths:
      - 'tests/acceptExpiryRace.test.cjs'
      - 'docs/evidence/m543-accept-expiry-race.json'
      - '.github/workflows/m543-accept-expiry-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accept-expiry-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m543-accept-expiry-race.json', 'utf8'))"
      - name: Run cross-process Accept-versus-expiry regressions
        run: node --test tests/acceptExpiryRace.test.cjs
