name: M478 TagDuel action rollback atomicity
on:
  push:
    branches:
      - feat/work-m478-tag-action-rollback-atomicity-20261121
    paths:
      - 'tests/tagActionRollbackAtomicity2v2.test.cjs'
      - 'docs/evidence/m478-tag-action-rollback-atomicity.json'
      - '.github/workflows/m478-tag-action-rollback-atomicity.yml'
  pull_request:
    paths:
      - 'tests/tagActionRollbackAtomicity2v2.test.cjs'
      - 'docs/evidence/m478-tag-action-rollback-atomicity.json'
      - '.github/workflows/m478-tag-action-rollback-atomicity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-action-rollback-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m478-tag-action-rollback-atomicity.json', 'utf8'))"
      - name: Run TagDuel action rollback tests
        run: node --test tests/tagActionRollbackAtomicity2v2.test.cjs
