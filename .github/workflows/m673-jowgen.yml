name: M673 Jowgen TagDuel lock adapter
on:
  pull_request:
    paths:
      - "src/jowgenTagAdapter.ts"
      - "tests/jowgenTagAdapter.test.cjs"
      - "docs/evidence/m673-jowgen.json"
      - "scripts/audit-jowgen-m673.cjs"
      - ".github/workflows/m673-jowgen.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/jowgenTagAdapter.test.cjs
      - run: node scripts/audit-jowgen-m673.cjs
      - run: npm run check:cards
