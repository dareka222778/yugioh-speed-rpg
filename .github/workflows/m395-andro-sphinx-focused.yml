name: M395 Andro Sphinx focused validation

on:
  pull_request:
    paths:
      - 'src/androSphinxRules.ts'
      - 'tests/androSphinxRules.test.cjs'
      - '.github/workflows/m395-andro-sphinx-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/androSphinxRules.test.cjs
