name: M567 Snatch Steal TagDuel adapter
on:
  push:
    branches:
      - feat/work-m567-snatch-steal-tag-adapter-20261123
    paths:
      - 'src/snatchStealTagAdapter.ts'
      - 'tests/snatchStealTagAdapter.test.cjs'
      - 'docs/evidence/m567-snatch-steal-tag-adapter.json'
      - '.github/workflows/m567-snatch-steal-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/snatchStealTagAdapter.ts'
      - 'tests/snatchStealTagAdapter.test.cjs'
      - 'docs/evidence/m567-snatch-steal-tag-adapter.json'
      - '.github/workflows/m567-snatch-steal-tag-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snatch-steal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate evidence JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m567-snatch-steal-tag-adapter.json', 'utf8'))"
      - name: Run M567 behavior regressions
        run: node --test tests/snatchStealTagAdapter.test.cjs
