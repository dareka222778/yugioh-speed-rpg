name: M553 Duel Discord Accept Decline Race
on:
  push:
    branches:
      - feat/work-m553-duel-discord-accept-decline-race-20261123
    paths:
      - 'tests/duelDiscordAcceptDeclineRace.test.cjs'
      - 'docs/evidence/m553-duel-discord-accept-decline-race.json'
      - '.github/workflows/m553-duel-discord-accept-decline-race.yml'
  pull_request:
    paths:
      - 'tests/duelDiscordAcceptDeclineRace.test.cjs'
      - 'docs/evidence/m553-duel-discord-accept-decline-race.json'
      - '.github/workflows/m553-duel-discord-accept-decline-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duel-discord-accept-decline-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m553-duel-discord-accept-decline-race.json', 'utf8'))"
      - name: Run cross-process real 1v1 Discord handler race
        run: node --test tests/duelDiscordAcceptDeclineRace.test.cjs
