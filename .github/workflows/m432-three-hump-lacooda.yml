name: M432 Three-Hump Lacooda
on:
  push:
    branches:
      - feat/work-m432-three-hump-lacooda-draw-2v2-20261121
    paths:
      - "src/threeHumpLacooda.ts"
      - "tests/threeHumpLacooda.test.cjs"
      - "docs/evidence/m432-three-hump-lacooda.json"
      - ".github/workflows/m432-three-hump-lacooda.yml"
  pull_request:
    branches:
      - feat/work-m367-identity-scoped-tribute-primitive-20261118
    paths:
      - "src/threeHumpLacooda.ts"
      - "tests/threeHumpLacooda.test.cjs"
      - "docs/evidence/m432-three-hump-lacooda.json"
      - ".github/workflows/m432-three-hump-lacooda.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/threeHumpLacooda.test.cjs
