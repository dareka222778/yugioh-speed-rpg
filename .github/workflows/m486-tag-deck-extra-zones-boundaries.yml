name: M486 TagDuel deck and zone boundaries
on:
  push:
    branches:
      - feat/work-m486-tag-deck-extra-zones-boundaries-20261121
    paths:
      - 'tests/tagDeckExtraAndZoneBoundaries2v2.test.cjs'
      - 'docs/evidence/m486-tag-deck-extra-zones-boundaries.json'
      - '.github/workflows/m486-tag-deck-extra-zones-boundaries.yml'
  pull_request:
    paths:
      - 'tests/tagDeckExtraAndZoneBoundaries2v2.test.cjs'
      - 'docs/evidence/m486-tag-deck-extra-zones-boundaries.json'
      - '.github/workflows/m486-tag-deck-extra-zones-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-deck-extra-zone-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m486-tag-deck-extra-zones-boundaries.json', 'utf8'))"
      - name: Run TagDuel 2v2 structural-rule tests
        run: node --test tests/tagDeckExtraAndZoneBoundaries2v2.test.cjs
