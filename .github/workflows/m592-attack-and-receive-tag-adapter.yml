name: M592 Attack and Receive TagDuel adapter
on:
  push:
    branches:
      - feat/work-m592-attack-and-receive-tag-adapter-20261124
    paths:
      - 'src/attackAndReceiveTagAdapter.ts'
      - 'tests/attackAndReceiveTagAdapter.test.cjs'
      - 'docs/evidence/m592-attack-and-receive-tag-adapter.json'
      - '.github/workflows/m592-attack-and-receive-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/attackAndReceiveTagAdapter.ts'
      - 'tests/attackAndReceiveTagAdapter.test.cjs'
      - 'docs/evidence/m592-attack-and-receive-tag-adapter.json'
      - '.github/workflows/m592-attack-and-receive-tag-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack-and-receive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m592-attack-and-receive-tag-adapter.json', 'utf8'))"
      - name: Run Attack and Receive adapter tests
        run: node --test tests/attackAndReceiveTagAdapter.test.cjs
