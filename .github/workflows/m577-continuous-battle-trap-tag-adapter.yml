name: M577 Continuous battle traps TagDuel adapter
on:
  push:
    branches: [feat/work-m577-mirror-wall-fairy-box-tag-adapter-20261123]
    paths:
      - 'src/continuousBattleTrapTagAdapter.ts'
      - 'tests/continuousBattleTrapTagAdapter.test.cjs'
      - 'docs/evidence/m577-continuous-battle-trap-tag-adapter.json'
      - '.github/workflows/m577-continuous-battle-trap-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/continuousBattleTrapTagAdapter.ts'
      - 'tests/continuousBattleTrapTagAdapter.test.cjs'
      - 'docs/evidence/m577-continuous-battle-trap-tag-adapter.json'
      - '.github/workflows/m577-continuous-battle-trap-tag-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuous-battle-traps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m577-continuous-battle-trap-tag-adapter.json', 'utf8'))"
      - name: Run M577 behavior regressions
        run: node --test tests/continuousBattleTrapTagAdapter.test.cjs
