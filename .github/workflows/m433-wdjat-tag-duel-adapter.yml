name: M433 Wdjat TagDuel Adapter
on:
  push:
    branches:
      - feat/work-m433-wdjat-tag-duel-adapter-20261121
    paths:
      - "src/wdjatTagDuelAdapter.ts"
      - "tests/wdjatTagDuelAdapter.test.cjs"
      - "docs/evidence/m433-wdjat-tag-duel-adapter.json"
      - ".github/workflows/m433-wdjat-tag-duel-adapter.yml"
  pull_request:
    branches:
      - feat/work-m401-wdjat-private-set-inspection-20261119
    paths:
      - "src/wdjatTagDuelAdapter.ts"
      - "tests/wdjatTagDuelAdapter.test.cjs"
      - "docs/evidence/m433-wdjat-tag-duel-adapter.json"
      - ".github/workflows/m433-wdjat-tag-duel-adapter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/wdjatTagDuelAdapter.test.cjs
