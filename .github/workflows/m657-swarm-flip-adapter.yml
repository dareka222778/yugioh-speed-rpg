name: M657 Swarm Flip TagDuel adapter
on:
  pull_request:
    branches: [feat/rea-engine-recovery-20261026]
    paths:
      - src/swarmFlipTagAdapter.ts
      - tests/swarmFlipTagAdapter.test.cjs
      - docs/evidence/m657-swarm-flip-adapter.json
      - scripts/audit-swarm-flip-m657.cjs
      - .github/workflows/m657-swarm-flip-adapter.yml
  push:
    branches: [feat/work-m657-swarm-flip-adapter-20261126]
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/swarmFlipTagAdapter.test.cjs
      - run: node scripts/audit-swarm-flip-m657.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m657-swarm-flip-evidence
          path: artifacts/m657-swarm-flip-results.json
          if-no-files-found: ignore
          retention-days: 14
  repository-regression:
    needs: focused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:tag-classic
