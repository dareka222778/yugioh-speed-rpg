name: M445 Typed Tribute TagDuel adapter
on:
  push:
    branches:
      - feat/work-m445-typed-tribute-tag-duel-adapter-20261121
    paths:
      - 'src/typedTributeTagDuelAdapter.ts'
      - 'tests/typedTributeTagDuelAdapter.test.cjs'
      - 'docs/evidence/m445-typed-tribute-tag-duel-adapter.json'
      - '.github/workflows/m445-typed-tribute-tag-duel-adapter.yml'
  pull_request:
    paths:
      - 'src/typedTributeTagDuelAdapter.ts'
      - 'tests/typedTributeTagDuelAdapter.test.cjs'
      - 'docs/evidence/m445-typed-tribute-tag-duel-adapter.json'
      - '.github/workflows/m445-typed-tribute-tag-duel-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-tribute-tag-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Run typed Tribute TagDuel adapter behavior tests
        run: node --test tests/typedTributeTagDuelAdapter.test.cjs
