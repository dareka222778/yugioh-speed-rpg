name: M491 A-Team TagDuel adapter
on:
  push:
    branches:
      - feat/work-m491-a-team-tag-duel-adapter-20261121
    paths:
      - 'src/aTeamTagDuelAdapter.ts'
      - 'tests/aTeamTagDuelAdapter.test.cjs'
      - 'docs/evidence/m491-a-team-tag-duel-adapter.json'
      - '.github/workflows/m491-a-team-tag-duel-adapter.yml'
  pull_request:
    paths:
      - 'src/aTeamTagDuelAdapter.ts'
      - 'tests/aTeamTagDuelAdapter.test.cjs'
      - 'docs/evidence/m491-a-team-tag-duel-adapter.json'
      - '.github/workflows/m491-a-team-tag-duel-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a-team-tag-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m491-a-team-tag-duel-adapter.json', 'utf8'))"
      - name: Run A-Team TagDuel adapter tests
        run: node --test tests/aTeamTagDuelAdapter.test.cjs
