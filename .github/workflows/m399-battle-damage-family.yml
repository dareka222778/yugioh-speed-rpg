name: M399 battle damage family
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'src/battleDamageFamily.ts'
      - 'tests/battleDamageFamily.test.cjs'
      - 'docs/evidence/m399-battle-damage-family.json'
      - '.github/workflows/m399-battle-damage-family.yml'
jobs:
  m399-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests-isolated.cjs tests/battleDamageFamily.test.cjs
