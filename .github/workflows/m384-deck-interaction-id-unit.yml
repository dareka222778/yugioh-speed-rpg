name: M384 Deck interaction ID unit validation
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'src/deckInteractionId.ts'
      - 'tests/deckInteractionIdUnit.test.cjs'
      - '.github/workflows/m384-deck-interaction-id-unit.yml'
jobs:
  deck-interaction-id-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/deckInteractionIdUnit.test.cjs
