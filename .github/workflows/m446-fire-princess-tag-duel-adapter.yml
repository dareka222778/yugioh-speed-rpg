name: M446 Fire Princess TagDuel adapter
on:
  push:
    branches:
      - feat/work-m446-fire-princess-tag-duel-adapter-20261121
    paths:
      - 'src/firePrincessTagDuelAdapter.ts'
      - 'tests/firePrincessTagDuelAdapter.test.cjs'
      - 'docs/evidence/m446-fire-princess-tag-duel-adapter.json'
      - '.github/workflows/m446-fire-princess-tag-duel-adapter.yml'
  pull_request:
    paths:
      - 'src/firePrincessTagDuelAdapter.ts'
      - 'tests/firePrincessTagDuelAdapter.test.cjs'
      - 'docs/evidence/m446-fire-princess-tag-duel-adapter.json'
      - '.github/workflows/m446-fire-princess-tag-duel-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fire-princess-tag-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Run Fire Princess TagDuel behavior tests
        run: node --test tests/firePrincessTagDuelAdapter.test.cjs
