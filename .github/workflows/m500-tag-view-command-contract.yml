name: M500 Tag Duel Private View Command Contract
on:
  push:
    branches:
      - feat/work-m500-tag-view-command-contract-20261122
    paths:
      - 'tests/tagDuelViewCommandContract.test.cjs'
      - 'docs/evidence/m500-tag-view-command-contract.json'
      - '.github/workflows/m500-tag-view-command-contract.yml'
  pull_request:
    paths:
      - 'tests/tagDuelViewCommandContract.test.cjs'
      - 'docs/evidence/m500-tag-view-command-contract.json'
      - '.github/workflows/m500-tag-view-command-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-private-view-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m500-tag-view-command-contract.json', 'utf8'))"
      - name: Run /dupla ver private view contract
        run: node --test tests/tagDuelViewCommandContract.test.cjs
