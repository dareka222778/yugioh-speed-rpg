name: M648 Quick-Play combat boost TagDuel adapter
on:
  push:
    branches:
      - feat/work-m648-quick-play-combat-boost-20261126
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/quickPlayCombatBoostTagAdapter.ts
      - tests/quickPlayCombatBoostTagAdapter.test.cjs
      - docs/evidence/m648-quick-play-combat-boost.json
      - .github/workflows/m648-quick-play-combat-boost.yml
permissions:
  contents: read
jobs:
  quick-play-combat-boost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node -e "const e=JSON.parse(require('node:fs').readFileSync('docs/evidence/m648-quick-play-combat-boost.json','utf8')); if(e.mission!=='M648'||e.verification.focusedTests!==30||e.verification.adapterBehaviorVerifiedCards!==2||e.verification.existingCertifiedCards!==2||e.verification.playableCatalogAdmission!==true||e.verification.behaviorCertifiedCards!==0) process.exit(1)"
      - run: node --test tests/quickPlayCombatBoostTagAdapter.test.cjs
