name: M604 The Unhappy Maiden Battle Phase end adapter
on:
  push:
    branches:
      - feat/work-m604-unhappy-maiden-battle-phase-end-20261124
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/unhappyMaidenBattlePhaseEndTagAdapter.ts
      - tests/unhappyMaidenBattlePhaseEndTagAdapter.test.cjs
      - docs/evidence/m604-unhappy-maiden-battle-phase-end.json
      - .github/workflows/m604-unhappy-maiden-battle-phase-end.yml
permissions:
  contents: read
jobs:
  unhappy-maiden-battle-phase-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m604-unhappy-maiden-battle-phase-end.json', 'utf8'))"
      - run: node --test tests/unhappyMaidenBattlePhaseEndTagAdapter.test.cjs
