name: M675 battle phase denial TagDuel adapter
on:
  push:
    branches:
      - "feat/work-m675-battle-phase-denial-20261127"
  pull_request:
    paths:
      - "src/battlePhaseDenialTagAdapter.ts"
      - "tests/battlePhaseDenialTagAdapter.test.cjs"
      - "docs/evidence/m675-battle-phase-denial.json"
      - "scripts/audit-battle-phase-denial-m675.cjs"
      - ".github/workflows/m675-battle-phase-denial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/battlePhaseDenialTagAdapter.test.cjs
      - run: node scripts/audit-battle-phase-denial-m675.cjs
      - run: npm run check:cards
