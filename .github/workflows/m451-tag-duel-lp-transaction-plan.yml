name: M451 TagDuel LP transaction planner
on:
  push:
    branches:
      - feat/work-m451-tag-duel-lp-transaction-plan-20261121
    paths:
      - 'src/tagDuelLifePointTransaction.ts'
      - 'tests/tagDuelLifePointTransaction.test.cjs'
      - 'docs/evidence/m451-tag-duel-lp-transaction-plan.json'
      - '.github/workflows/m451-tag-duel-lp-transaction-plan.yml'
  pull_request:
    paths:
      - 'src/tagDuelLifePointTransaction.ts'
      - 'tests/tagDuelLifePointTransaction.test.cjs'
      - 'docs/evidence/m451-tag-duel-lp-transaction-plan.json'
      - '.github/workflows/m451-tag-duel-lp-transaction-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-duel-lp-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m451-tag-duel-lp-transaction-plan.json', 'utf8'))"
      - name: Run TagDuel LP transaction behavior tests
        run: node --test tests/tagDuelLifePointTransaction.test.cjs
