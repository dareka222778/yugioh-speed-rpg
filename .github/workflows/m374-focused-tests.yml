name: M374 focused battle-damage reward regressions
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'src/battleDamageRewards.ts'
      - 'tests/battleDamageRewards.test.cjs'
      - '.github/workflows/m374-focused-tests.yml'
jobs:
  m374-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests-isolated.cjs tests/battleDamageRewards.test.cjs
