name: M548 Gate Guardian Damage Calculation TagDuel adapter
on:
  push:
    branches:
      - feat/work-m548-gate-guardian-damage-calculation-tag-adapter-20261123
    paths:
      - 'src/gateGuardianDamageCalculationTagAdapter.ts'
      - 'tests/gateGuardianDamageCalculationTagAdapter.test.cjs'
      - 'docs/evidence/m548-gate-guardian-damage-calculation-tag-adapter.json'
      - '.github/workflows/m548-gate-guardian-damage-calculation-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/gateGuardianDamageCalculationTagAdapter.ts'
      - 'tests/gateGuardianDamageCalculationTagAdapter.test.cjs'
      - 'docs/evidence/m548-gate-guardian-damage-calculation-tag-adapter.json'
      - '.github/workflows/m548-gate-guardian-damage-calculation-tag-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-guardian-damage-calculation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m548-gate-guardian-damage-calculation-tag-adapter.json', 'utf8'))"
      - name: Run Gate Guardian Damage Calculation tests
        run: node --test tests/gateGuardianDamageCalculationTagAdapter.test.cjs
