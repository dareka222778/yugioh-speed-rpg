name: M525 TagDuel Action Receipt Timeout Replay
on:
  push:
    branches:
      - feat/work-m525-tag-action-receipt-timeout-replay-20261122
    paths:
      - 'src/tagStore.ts'
      - 'tests/tagActionReceiptTimeoutReplay2v2.test.cjs'
      - 'docs/evidence/m525-tag-action-receipt-timeout-replay-2v2.json'
      - '.github/workflows/m525-tag-action-receipt-timeout-replay-2v2.yml'
  pull_request:
    paths:
      - 'src/tagStore.ts'
      - 'tests/tagActionReceiptTimeoutReplay2v2.test.cjs'
      - 'docs/evidence/m525-tag-action-receipt-timeout-replay-2v2.json'
      - '.github/workflows/m525-tag-action-receipt-timeout-replay-2v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-action-receipt-timeout-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m525-tag-action-receipt-timeout-replay-2v2.json', 'utf8'))"
      - name: Run action receipt timeout replay regression
        run: node --test tests/tagActionReceiptTimeoutReplay2v2.test.cjs
