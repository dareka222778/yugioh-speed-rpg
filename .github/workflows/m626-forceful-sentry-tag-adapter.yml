name: M626 The Forceful Sentry Tag Adapter
on:
  push:
    branches:
      - feat/work-m626-forceful-sentry-tag-adapter-20261125
    paths:
      - src/forcefulSentryTagAdapter.ts
      - tests/forcefulSentryTagAdapter.test.cjs
      - docs/evidence/m626-forceful-sentry-tag-adapter.json
      - .github/workflows/m626-forceful-sentry-tag-adapter.yml
  pull_request:
    branches:
      - feat/work-m625-confiscation-tag-adapter-20261125
    paths:
      - src/forcefulSentryTagAdapter.ts
      - tests/forcefulSentryTagAdapter.test.cjs
      - docs/evidence/m626-forceful-sentry-tag-adapter.json
      - .github/workflows/m626-forceful-sentry-tag-adapter.yml
permissions:
  contents: read
concurrency:
  group: m626-forceful-sentry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate evidence metadata
        run: node -e "const e=require('./docs/evidence/m626-forceful-sentry-tag-adapter.json'); if(e.format!==1 || e.mission!=='M626' || e.cards.length!==1 || e.cards[0].passcode!=='42829885' || e.verification.focusedScenarios!==30 || e.verification.newCertifications!==0 || e.verification.inventoryGranted!==0 || e.production.merge || e.production.deploy) process.exit(1)"
      - run: node --test tests/forcefulSentryTagAdapter.test.cjs
