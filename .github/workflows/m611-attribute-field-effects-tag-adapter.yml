name: M611 Attribute Field Effects Tag Adapter
on:
  push:
    branches:
      - feat/work-m611-attribute-field-effects-20261125
    paths:
      - src/attributeFieldEffectsTagAdapter.ts
      - tests/attributeFieldEffectsTagAdapter.test.cjs
      - docs/evidence/m611-attribute-field-effects-tag-adapter.json
      - .github/workflows/m611-attribute-field-effects-tag-adapter.yml
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/attributeFieldEffectsTagAdapter.ts
      - tests/attributeFieldEffectsTagAdapter.test.cjs
      - docs/evidence/m611-attribute-field-effects-tag-adapter.json
      - .github/workflows/m611-attribute-field-effects-tag-adapter.yml
permissions:
  contents: read
concurrency:
  group: m611-attribute-field-effects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate evidence metadata
        run: node -e "const e=require('./docs/evidence/m611-attribute-field-effects-tag-adapter.json'); if(e.format!==1 || e.mission!=='M611' || e.cards.length!==2 || e.verification.newCertifications!==0) process.exit(1)"
      - run: node --test tests/attributeFieldEffectsTagAdapter.test.cjs
