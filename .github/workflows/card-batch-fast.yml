name: Card batch fast feedback
on:
  push:
    branches: [feat/work-m61-handlimit-regressions-20261111]
  pull_request:
    branches: [main, classic-engine-foundation, feat/rea-engine-recovery-20261026]
  workflow_dispatch:
jobs:
  card-batch-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/card-batch-fast.cjs
