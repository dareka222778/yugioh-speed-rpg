name: M430 Jar of Greed Discord 2v2
on:
  pull_request:
    paths:
      - 'tests/tagClassicJarOfGreedDiscord2v2.test.cjs'
      - 'docs/evidence/m430-jar-of-greed-discord-2v2.json'
      - '.github/workflows/m430-jar-of-greed-discord-2v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jar-of-greed-discord-2v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify Jar of Greed physical Deck routing and Discord privacy
        run: node --test tests/tagClassicJarOfGreedDiscord2v2.test.cjs
