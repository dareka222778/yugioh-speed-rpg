name: M489 Deck slash-command contract
on:
  push:
    branches:
      - feat/work-m489-deck-command-contract-20261121
    paths:
      - 'tests/deckSlashCommandContract.test.cjs'
      - 'docs/evidence/m489-deck-slash-command-contract.json'
      - '.github/workflows/m489-deck-slash-command-contract.yml'
  pull_request:
    paths:
      - 'tests/deckSlashCommandContract.test.cjs'
      - 'docs/evidence/m489-deck-slash-command-contract.json'
      - '.github/workflows/m489-deck-slash-command-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deck-slash-command-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m489-deck-slash-command-contract.json', 'utf8'))"
      - name: Run /deck command contract tests
        run: node --test tests/deckSlashCommandContract.test.cjs
