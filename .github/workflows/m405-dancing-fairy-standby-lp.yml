name: M405 Dancing Fairy Standby LP
on:
  push:
    branches:
      - feat/work-m405-dancing-fairy-standby-lp-20261120
  pull_request:
    paths:
      - "src/dancingFairyStandby.ts"
      - "tests/dancingFairyStandby.test.cjs"
      - "docs/evidence/m405-dancing-fairy-standby-lp.json"
      - ".github/workflows/m405-dancing-fairy-standby-lp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/dancingFairyStandby.test.cjs
