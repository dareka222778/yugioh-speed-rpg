name: M416 battle-destroyed swarm family focused validation
on:
  pull_request:
    paths:
      - 'src/battleDestroyedSwarm.ts'
      - 'tests/battleDestroyedSwarm.test.cjs'
      - 'docs/evidence/m416-battle-destroyed-swarm.json'
      - '.github/workflows/m416-battle-destroyed-swarm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/battleDestroyedSwarm.test.cjs
