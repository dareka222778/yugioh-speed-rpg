name: M447 Solemn Wishes TagDuel adapter
on:
  push:
    branches:
      - feat/work-m447-solemn-wishes-tag-duel-adapter-20261121
    paths:
      - 'src/solemnWishesTagDuelAdapter.ts'
      - 'tests/solemnWishesTagDuelAdapter.test.cjs'
      - 'docs/evidence/m447-solemn-wishes-tag-duel-adapter.json'
      - '.github/workflows/m447-solemn-wishes-tag-duel-adapter.yml'
  pull_request:
    paths:
      - 'src/solemnWishesTagDuelAdapter.ts'
      - 'tests/solemnWishesTagDuelAdapter.test.cjs'
      - 'docs/evidence/m447-solemn-wishes-tag-duel-adapter.json'
      - '.github/workflows/m447-solemn-wishes-tag-duel-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solemn-wishes-tag-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Run Solemn Wishes TagDuel behavior tests
        run: node --test tests/solemnWishesTagDuelAdapter.test.cjs
