name: M509 Tag Lobby Accept Atomicity
on:
  push:
    branches:
      - feat/work-m509-tag-lobby-accept-atomicity-20261122
    paths:
      - 'tests/tagLobbyAcceptAtomicity2v2.test.cjs'
      - 'docs/evidence/m509-tag-lobby-accept-atomicity.json'
      - '.github/workflows/m509-tag-lobby-accept-atomicity.yml'
  pull_request:
    paths:
      - 'tests/tagLobbyAcceptAtomicity2v2.test.cjs'
      - 'docs/evidence/m509-tag-lobby-accept-atomicity.json'
      - '.github/workflows/m509-tag-lobby-accept-atomicity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-lobby-accept-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m509-tag-lobby-accept-atomicity.json', 'utf8'))"
      - name: Run 2v2 acceptance isolation and rollback tests
        run: node --test tests/tagLobbyAcceptAtomicity2v2.test.cjs
