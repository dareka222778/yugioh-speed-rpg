name: M396 Ancient Lamp focused validation

on:
  pull_request:
    paths:
      - 'src/ancientLampRules.ts'
      - 'tests/ancientLampRules.test.cjs'
      - '.github/workflows/m396-ancient-lamp-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/ancientLampRules.test.cjs
