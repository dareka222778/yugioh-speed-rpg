name: M639 reveal and attack-lock TagDuel adapter
on:
  push:
    branches:
      - feat/work-m639-reveal-attack-lock-tag-adapter-20261126
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/revealAndAttackLockTagAdapter.ts
      - tests/revealAndAttackLockTagAdapter.test.cjs
      - docs/evidence/m639-reveal-attack-lock.json
      - .github/workflows/m639-reveal-attack-lock-tag-adapter.yml
permissions:
  contents: read
jobs:
  reveal-and-attack-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m639-reveal-attack-lock.json', 'utf8'))"
      - run: node --test tests/revealAndAttackLockTagAdapter.test.cjs
