name: M524 TagDuel Timeout Seat Rotation Matrix
on:
  push:
    branches:
      - feat/work-m524-tag-timeout-seat-rotation-matrix-20261122
    paths:
      - 'tests/tagTimeoutSeatRotationMatrix2v2.test.cjs'
      - 'docs/evidence/m524-tag-timeout-seat-rotation-matrix-2v2.json'
      - '.github/workflows/m524-tag-timeout-seat-rotation-matrix-2v2.yml'
  pull_request:
    paths:
      - 'tests/tagTimeoutSeatRotationMatrix2v2.test.cjs'
      - 'docs/evidence/m524-tag-timeout-seat-rotation-matrix-2v2.json'
      - '.github/workflows/m524-tag-timeout-seat-rotation-matrix-2v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-timeout-seat-rotation-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m524-tag-timeout-seat-rotation-matrix-2v2.json', 'utf8'))"
      - name: Run four-seat timeout rotation matrix
        run: node --test tests/tagTimeoutSeatRotationMatrix2v2.test.cjs
