name: M515 1v1 Duel Timeout Boundary Atomicity
on:
  push:
    branches:
      - feat/work-m515-duel-timeout-boundary-atomicity-20261122
    paths:
      - 'tests/duelTimeoutBoundaryAtomicity.test.cjs'
      - 'docs/evidence/m515-duel-timeout-boundary-atomicity.json'
      - '.github/workflows/m515-duel-timeout-boundary-atomicity.yml'
  pull_request:
    paths:
      - 'tests/duelTimeoutBoundaryAtomicity.test.cjs'
      - 'docs/evidence/m515-duel-timeout-boundary-atomicity.json'
      - '.github/workflows/m515-duel-timeout-boundary-atomicity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duel-timeout-boundary-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m515-duel-timeout-boundary-atomicity.json', 'utf8'))"
      - name: Run 1v1 timeout boundary and rollback matrix
        run: node --test tests/duelTimeoutBoundaryAtomicity.test.cjs
