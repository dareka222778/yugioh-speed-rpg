name: M646 Exchange TagDuel adapter
on:
  push:
    branches:
      - feat/work-m646-exchange-tag-adapter-20261126
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/exchangeTagAdapter.ts
      - tests/exchangeTagAdapter.test.cjs
      - docs/evidence/m646-exchange.json
      - .github/workflows/m646-exchange.yml
permissions:
  contents: read
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node -e "const e=JSON.parse(require('node:fs').readFileSync('docs/evidence/m646-exchange.json','utf8')); if(e.mission!=='M646'||e.verification.focusedTests!==23||e.verification.behaviorCertifiedCards!==0||e.verification.adapterBehaviorVerifiedCards!==0) process.exit(1)"
      - run: node --test tests/exchangeTagAdapter.test.cjs
