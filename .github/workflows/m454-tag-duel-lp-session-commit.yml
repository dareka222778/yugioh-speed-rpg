name: M454 TagDuel LP session transaction
on:
  push:
    branches:
      - feat/work-m454-tag-duel-lp-session-commit-20261121
    paths:
      - 'src/tagDuelLifePointStore.ts'
      - 'tests/tagDuelLifePointStore.test.cjs'
      - 'docs/evidence/m454-tag-duel-lp-session-commit.json'
      - '.github/workflows/m454-tag-duel-lp-session-commit.yml'
  pull_request:
    paths:
      - 'src/tagDuelLifePointStore.ts'
      - 'tests/tagDuelLifePointStore.test.cjs'
      - 'docs/evidence/m454-tag-duel-lp-session-commit.json'
      - '.github/workflows/m454-tag-duel-lp-session-commit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-duel-lp-session-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m454-tag-duel-lp-session-commit.json', 'utf8'))"
      - name: Run isolated SQLite LP session transaction tests
        run: node --test tests/tagDuelLifePointStore.test.cjs
