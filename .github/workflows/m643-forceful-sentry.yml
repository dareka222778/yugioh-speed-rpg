name: M643 The Forceful Sentry TagDuel adapter
on:
  push:
    branches:
      - feat/work-m643-forceful-sentry-tag-adapter-20261126
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/forcefulSentryTagAdapter.ts
      - tests/forcefulSentryTagAdapter.test.cjs
      - docs/evidence/m643-forceful-sentry.json
      - .github/workflows/m643-forceful-sentry.yml
permissions:
  contents: read
jobs:
  forceful-sentry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m643-forceful-sentry.json', 'utf8'))"
      - run: node --test tests/forcefulSentryTagAdapter.test.cjs
