name: M671 multi-attack and Spirit adapter
on:
  pull_request:
    paths:
      - "src/multiAttackSpiritTagAdapter.ts"
      - "tests/multiAttackSpiritTagAdapter.test.cjs"
      - "docs/evidence/m671-multi-attack-spirit.json"
      - "scripts/audit-multi-attack-spirit-m671.cjs"
      - ".github/workflows/m671-multi-attack-spirit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/multiAttackSpiritTagAdapter.test.cjs
      - run: node scripts/audit-multi-attack-spirit-m671.cjs
      - run: npm run check:cards
