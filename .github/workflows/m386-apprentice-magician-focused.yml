name: M386 Apprentice Magician focused validation
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'src/apprenticeMagician.ts'
      - 'tests/apprenticeMagician.test.cjs'
      - '.github/workflows/m386-apprentice-magician-focused.yml'
jobs:
  apprentice-magician:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/apprenticeMagician.test.cjs
