name: M412 historical identity crosswalk uniqueness
on:
  pull_request:
    paths:
      - 'scripts/audit-historical-admission.cjs'
      - 'tests/historicalAdmissionCrosswalk.test.cjs'
      - '.github/workflows/m412-historical-crosswalk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosswalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/historicalAdmissionCrosswalk.test.cjs
      - run: node scripts/audit-historical-admission.cjs
