name: M581 Equip attack lock TagDuel adapter
on:
  push:
    branches: [feat/work-m581-equip-attack-lock-20261124]
    paths:
      - 'src/equipAttackLockTagAdapter.ts'
      - 'tests/equipAttackLockTagAdapter.test.cjs'
      - 'docs/evidence/m581-equip-attack-lock-tag-adapter.json'
      - '.github/workflows/m581-equip-attack-lock-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/equipAttackLockTagAdapter.ts'
      - 'tests/equipAttackLockTagAdapter.test.cjs'
      - 'docs/evidence/m581-equip-attack-lock-tag-adapter.json'
      - '.github/workflows/m581-equip-attack-lock-tag-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equip-attack-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m581-equip-attack-lock-tag-adapter.json', 'utf8'))"
      - name: Run M581 behavior regressions
        run: node --test tests/equipAttackLockTagAdapter.test.cjs
