name: M539 Cross-Mode Timeout Lock Release
on:
  push:
    branches:
      - feat/work-m539-cross-mode-timeout-lock-release-20261122
    paths:
      - 'tests/crossModeTimeoutLockRelease.test.cjs'
      - 'docs/evidence/m539-cross-mode-timeout-lock-release.json'
      - '.github/workflows/m539-cross-mode-timeout-lock-release.yml'
  pull_request:
    paths:
      - 'tests/crossModeTimeoutLockRelease.test.cjs'
      - 'docs/evidence/m539-cross-mode-timeout-lock-release.json'
      - '.github/workflows/m539-cross-mode-timeout-lock-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-mode-timeout-lock-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate evidence JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m539-cross-mode-timeout-lock-release.json', 'utf8'))"
      - name: Run cross-mode timeout lock lifecycle tests
        run: node --test tests/crossModeTimeoutLockRelease.test.cjs
