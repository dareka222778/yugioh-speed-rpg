name: M656 battle target policies TagDuel adapters
on:
  pull_request:
    branches: [feat/rea-engine-recovery-20261026]
    paths:
      - src/battleTargetPolicyTagAdapter.ts
      - tests/battleTargetPolicyTagAdapter.test.cjs
      - docs/evidence/m656-battle-target-policies.json
      - scripts/audit-battle-target-policy-m656.cjs
      - .github/workflows/m656-battle-target-policies.yml
  push:
    branches: [feat/work-m656-battle-target-policies-20261126]
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/battleTargetPolicyTagAdapter.test.cjs
      - run: node scripts/audit-battle-target-policy-m656.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m656-battle-target-policy-evidence
          path: artifacts/m656-battle-target-policy-results.json
          if-no-files-found: ignore
          retention-days: 14
  repository-regression:
    needs: focused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:tag-classic
