name: M586 Flip burn TagDuel adapter
on:
  push:
    branches:
      - feat/work-m586-flip-burn-tag-adapter-20261124
  pull_request:
    paths:
      - src/flipBurnTagAdapter.ts
      - tests/flipBurnTagAdapter.test.cjs
      - docs/evidence/m586-flip-burn-tag-adapter.json
      - .github/workflows/m586-flip-burn-tag-adapter.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node -e "JSON.parse(require('fs').readFileSync('docs/evidence/m586-flip-burn-tag-adapter.json','utf8'))"
      - run: node --test tests/flipBurnTagAdapter.test.cjs
