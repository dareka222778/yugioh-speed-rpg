name: M493 A Hero Emerges TagDuel adapter
on:
  push:
    branches:
      - feat/work-m493-a-hero-emerges-tag-adapter-20261122
    paths:
      - 'src/aHeroEmergesTagAdapter.ts'
      - 'tests/aHeroEmergesTagAdapter.test.cjs'
      - 'docs/evidence/m493-a-hero-emerges-tag-adapter.json'
      - '.github/workflows/m493-a-hero-emerges-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/aHeroEmergesTagAdapter.ts'
      - 'tests/aHeroEmergesTagAdapter.test.cjs'
      - 'docs/evidence/m493-a-hero-emerges-tag-adapter.json'
      - '.github/workflows/m493-a-hero-emerges-tag-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a-hero-emerges-tag-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m493-a-hero-emerges-tag-adapter.json', 'utf8'))"
      - name: Run A Hero Emerges TagDuel tests
        run: node --test tests/aHeroEmergesTagAdapter.test.cjs
