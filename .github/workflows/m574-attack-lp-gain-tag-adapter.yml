name: M574 Attack LP Gain TagDuel adapter
on:
  push:
    branches: [feat/work-m574-attack-lp-gain-tag-adapter-20261123]
    paths:
      - 'src/attackLpGainTagAdapter.ts'
      - 'tests/attackLpGainTagAdapter.test.cjs'
      - 'docs/evidence/m574-attack-lp-gain-tag-adapter.json'
      - '.github/workflows/m574-attack-lp-gain-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/attackLpGainTagAdapter.ts'
      - 'tests/attackLpGainTagAdapter.test.cjs'
      - 'docs/evidence/m574-attack-lp-gain-tag-adapter.json'
      - '.github/workflows/m574-attack-lp-gain-tag-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attack-lp-gain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m574-attack-lp-gain-tag-adapter.json', 'utf8'))"
      - name: Run M574 behavior regressions
        run: node --test tests/attackLpGainTagAdapter.test.cjs
