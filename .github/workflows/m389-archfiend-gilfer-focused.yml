name: M389 Archfiend of Gilfer focused validation
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'src/archfiendGilfer.ts'
      - 'tests/archfiendGilfer.test.cjs'
      - '.github/workflows/m389-archfiend-gilfer-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archfiend-gilfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/archfiendGilfer.test.cjs
