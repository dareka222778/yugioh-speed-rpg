name: M476 TagDuel last-seat start atomicity
on:
  push:
    branches:
      - feat/work-m476-tag-last-seat-start-atomicity-20261121
    paths:
      - 'tests/tagLobbyLastSeatStartAtomicity2v2.test.cjs'
      - 'docs/evidence/m476-tag-last-seat-start-atomicity.json'
      - '.github/workflows/m476-tag-last-seat-start-atomicity.yml'
  pull_request:
    paths:
      - 'tests/tagLobbyLastSeatStartAtomicity2v2.test.cjs'
      - 'docs/evidence/m476-tag-last-seat-start-atomicity.json'
      - '.github/workflows/m476-tag-last-seat-start-atomicity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-last-seat-start-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m476-tag-last-seat-start-atomicity.json', 'utf8'))"
      - name: Run TagDuel last-seat start atomicity test
        run: node --test tests/tagLobbyLastSeatStartAtomicity2v2.test.cjs
