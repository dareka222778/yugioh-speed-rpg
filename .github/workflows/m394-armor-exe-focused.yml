name: M394 Armor Exe Standby upkeep focused validation

on:
  pull_request:
    paths:
      - 'src/armorExeRules.ts'
      - 'tests/armorExeRules.test.cjs'
      - '.github/workflows/m394-armor-exe-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/armorExeRules.test.cjs
