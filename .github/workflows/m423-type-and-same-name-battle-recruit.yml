name: M423 type and same-name battle recruiter focused validation

on:
  pull_request:
    paths:
      - 'src/typeAndSameNameBattleRecruit.ts'
      - 'tests/typeAndSameNameBattleRecruit.test.cjs'
      - 'docs/evidence/m423-type-and-same-name-battle-recruit.json'
      - '.github/workflows/m423-type-and-same-name-battle-recruit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-and-same-name-recruit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Run type and same-name recruit behavior tests
        run: node --test tests/typeAndSameNameBattleRecruit.test.cjs
