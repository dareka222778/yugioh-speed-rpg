name: M651 control-change adapter
on:
  push:
    branches:
      - feat/work-m651-control-change-20261126
    paths:
      - "src/controlChangeTagAdapter.ts"
      - "tests/controlChangeTagAdapter.test.cjs"
      - "docs/evidence/m651-control-change.json"
      - ".github/workflows/m651-control-change.yml"
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - "src/controlChangeTagAdapter.ts"
      - "tests/controlChangeTagAdapter.test.cjs"
      - "docs/evidence/m651-control-change.json"
      - ".github/workflows/m651-control-change.yml"
permissions:
  contents: read
concurrency:
  group: m651-control-change-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/controlChangeTagAdapter.test.cjs
      - run: npm test
      - run: npm run audit:tag-classic
      - name: Validate evidence without certifying cards
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('docs/evidence/m651-control-change.json', 'utf8'));
          if (evidence.format !== 1 || evidence.mission !== 'M651') throw new Error('Invalid evidence header');
          if (evidence.cards.length !== 2 || evidence.scenarioCount < 20) throw new Error('Incomplete card/scenario evidence');
          if (evidence.cards.some(card => card.admitted || card.certified)) throw new Error('Adapter CI must not admit or certify cards');
          if (evidence.automaticCertifications !== 0 || evidence.inventoryGranted !== 0) throw new Error('Unsafe side effect recorded');
          console.log('M651 evidence valid; catalog and inventory unchanged.');
          NODE
