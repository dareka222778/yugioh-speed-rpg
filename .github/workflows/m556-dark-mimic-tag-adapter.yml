name: M556 Dark Mimic TagDuel adapter
on:
  push:
    branches:
      - feat/work-m556-dark-mimic-tag-adapter-20261123
    paths:
      - 'src/darkMimicTagAdapter.ts'
      - 'tests/darkMimicTagAdapter.test.cjs'
      - 'docs/evidence/m556-dark-mimic-tag-adapter.json'
      - '.github/workflows/m556-dark-mimic-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/darkMimicTagAdapter.ts'
      - 'tests/darkMimicTagAdapter.test.cjs'
      - 'docs/evidence/m556-dark-mimic-tag-adapter.json'
      - '.github/workflows/m556-dark-mimic-tag-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dark-mimic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate evidence
        run: node -e "const e=JSON.parse(require('node:fs').readFileSync('docs/evidence/m556-dark-mimic-tag-adapter.json','utf8')); if(e.certification.newCertifications!==0||e.inventoryGranted!==0) process.exit(1)"
      - name: Run M556 Dark Mimic regressions
        run: node --test tests/darkMimicTagAdapter.test.cjs
