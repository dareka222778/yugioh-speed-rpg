name: M687 Amazoness behavior adapter
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/amazonessBattleTagAdapter.ts
      - tests/amazonessBattleTagAdapter.test.cjs
      - docs/evidence/m687-amazoness-battle.json
      - scripts/audit-amazoness-m687.cjs
      - .github/workflows/m687-amazoness.yml
  push:
    branches:
      - feat/work-m687-amazoness-tag-adapter-20261127
jobs:
  amazoness-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/amazonessBattleTagAdapter.test.cjs
      - run: node scripts/audit-amazoness-m687.cjs
