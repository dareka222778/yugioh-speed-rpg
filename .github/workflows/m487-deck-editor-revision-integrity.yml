name: M487 Deck editor revision integrity
on:
  push:
    branches:
      - feat/work-m487-deck-editor-revision-integrity-20261121
    paths:
      - 'tests/deckEditorRevisionIntegrity.test.cjs'
      - 'docs/evidence/m487-deck-editor-revision-integrity.json'
      - '.github/workflows/m487-deck-editor-revision-integrity.yml'
  pull_request:
    paths:
      - 'tests/deckEditorRevisionIntegrity.test.cjs'
      - 'docs/evidence/m487-deck-editor-revision-integrity.json'
      - '.github/workflows/m487-deck-editor-revision-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deck-editor-revision-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m487-deck-editor-revision-integrity.json', 'utf8'))"
      - name: Run Deck editor integrity tests
        run: node --test tests/deckEditorRevisionIntegrity.test.cjs
