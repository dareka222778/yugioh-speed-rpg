name: M545 Arsenal Bug TagDuel adapter
on:
  push:
    branches:
      - feat/work-m545-arsenal-bug-tag-adapter-20261123
    paths:
      - 'src/arsenalBugTagAdapter.ts'
      - 'tests/arsenalBugTagAdapter.test.cjs'
      - 'docs/evidence/m545-arsenal-bug-tag-adapter.json'
      - '.github/workflows/m545-arsenal-bug-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/arsenalBugTagAdapter.ts'
      - 'tests/arsenalBugTagAdapter.test.cjs'
      - 'docs/evidence/m545-arsenal-bug-tag-adapter.json'
      - '.github/workflows/m545-arsenal-bug-tag-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arsenal-bug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m545-arsenal-bug-tag-adapter.json', 'utf8'))"
      - name: Run Arsenal Bug TagDuel tests
        run: node --test tests/arsenalBugTagAdapter.test.cjs
