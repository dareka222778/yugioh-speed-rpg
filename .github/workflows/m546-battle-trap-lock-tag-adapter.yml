name: M546 Battle Trap Lock TagDuel adapter
on:
  push:
    branches:
      - feat/work-m546-battle-trap-lock-tag-adapter-20261123
    paths:
      - 'src/battleTrapLockTagAdapter.ts'
      - 'tests/battleTrapLockTagAdapter.test.cjs'
      - 'docs/evidence/m546-battle-trap-lock-tag-adapter.json'
      - '.github/workflows/m546-battle-trap-lock-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/battleTrapLockTagAdapter.ts'
      - 'tests/battleTrapLockTagAdapter.test.cjs'
      - 'docs/evidence/m546-battle-trap-lock-tag-adapter.json'
      - '.github/workflows/m546-battle-trap-lock-tag-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle-trap-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m546-battle-trap-lock-tag-adapter.json', 'utf8'))"
      - name: Run Battle Trap Lock TagDuel tests
        run: node --test tests/battleTrapLockTagAdapter.test.cjs
