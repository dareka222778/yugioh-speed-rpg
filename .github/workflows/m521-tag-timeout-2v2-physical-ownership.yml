name: M521 Persisted 2v2 Timeout and Physical Ownership
on:
  push:
    branches:
      - feat/work-m521-tag-timeout-2v2-physical-ownership-20261122
    paths:
      - 'tests/tagTimeout2v2PhysicalOwnership.test.cjs'
      - 'docs/evidence/m521-tag-timeout-2v2-physical-ownership.json'
      - '.github/workflows/m521-tag-timeout-2v2-physical-ownership.yml'
  pull_request:
    paths:
      - 'tests/tagTimeout2v2PhysicalOwnership.test.cjs'
      - 'docs/evidence/m521-tag-timeout-2v2-physical-ownership.json'
      - '.github/workflows/m521-tag-timeout-2v2-physical-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-timeout-2v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m521-tag-timeout-2v2-physical-ownership.json', 'utf8'))"
      - name: Run persisted 2v2 timeout tests
        run: node --test tests/tagTimeout2v2PhysicalOwnership.test.cjs
