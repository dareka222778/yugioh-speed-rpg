name: M661 Spell Canceller and Imperial Order
on:
  pull_request:
    paths:
      - 'src/spellNegationTagAdapter.ts'
      - 'tests/spellNegationTagAdapter.test.cjs'
      - 'docs/evidence/m661-spell-negation.json'
      - 'scripts/audit-spell-negation-m661.cjs'
      - '.github/workflows/m661-spell-negation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/spellNegationTagAdapter.test.cjs
      - run: node scripts/audit-spell-negation-m661.cjs
