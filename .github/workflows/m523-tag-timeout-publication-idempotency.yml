name: M523 TagDuel Timeout Publication Idempotency
on:
  push:
    branches:
      - feat/work-m523-tag-timeout-publication-idempotency-20261122
    paths:
      - 'tests/tagTimeoutPublicationIdempotency.test.cjs'
      - 'docs/evidence/m523-tag-timeout-publication-idempotency.json'
      - '.github/workflows/m523-tag-timeout-publication-idempotency.yml'
  pull_request:
    paths:
      - 'tests/tagTimeoutPublicationIdempotency.test.cjs'
      - 'docs/evidence/m523-tag-timeout-publication-idempotency.json'
      - '.github/workflows/m523-tag-timeout-publication-idempotency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-timeout-publication-idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m523-tag-timeout-publication-idempotency.json', 'utf8'))"
      - name: Run TagDuel timeout publication tests
        run: node --test tests/tagTimeoutPublicationIdempotency.test.cjs
