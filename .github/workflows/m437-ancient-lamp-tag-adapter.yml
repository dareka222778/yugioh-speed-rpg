name: M437 Ancient Lamp TagDuel adapter

on:
  pull_request:
    paths:
      - 'src/ancientLampTagAdapter.ts'
      - 'tests/ancientLampTagAdapter.test.cjs'
      - 'docs/evidence/m437-ancient-lamp-tag-adapter.json'
      - '.github/workflows/m437-ancient-lamp-tag-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/ancientLampTagAdapter.test.cjs
