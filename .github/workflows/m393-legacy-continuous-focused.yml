name: M393 Amazoness Tiger and Arsenal Bug focused validation

on:
  pull_request:
    paths:
      - 'src/legacyContinuousMonsterRules.ts'
      - 'tests/legacyContinuousMonsterRules.test.cjs'
      - '.github/workflows/m393-legacy-continuous-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/legacyContinuousMonsterRules.test.cjs
