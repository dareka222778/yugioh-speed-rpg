name: M385 Asura Priest focused validation
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'src/asuraPriestRules.ts'
      - 'tests/asuraPriestRules.test.cjs'
      - '.github/workflows/m385-asura-priest-focused.yml'
jobs:
  asura-priest-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/asuraPriestRules.test.cjs
