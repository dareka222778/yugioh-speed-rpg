name: M403 Fire Princess LP Gain Burn

on:
  push:
    branches:
      - feat/work-m403-fire-princess-lp-gain-burn-20261120
  pull_request:
    paths:
      - "src/firePrincessLpGain.ts"
      - "tests/firePrincessLpGain.test.cjs"
      - "docs/evidence/m403-fire-princess-lp-gain.json"
      - ".github/workflows/m403-fire-princess-lp-gain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/firePrincessLpGain.test.cjs
