name: M538 Cross-Process Duel Mode Lock Race
on:
  push:
    branches:
      - feat/work-m538-cross-mode-lock-race-20261122
    paths:
      - 'tests/duelCrossModeLockRace.test.cjs'
      - 'docs/evidence/m538-duel-cross-mode-lock-race.json'
      - '.github/workflows/m538-duel-cross-mode-lock-race.yml'
  pull_request:
    paths:
      - 'tests/duelCrossModeLockRace.test.cjs'
      - 'docs/evidence/m538-duel-cross-mode-lock-race.json'
      - '.github/workflows/m538-duel-cross-mode-lock-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-process-lock-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m538-duel-cross-mode-lock-race.json', 'utf8'))"
      - name: Run cross-process lock race regression
        run: node --test tests/duelCrossModeLockRace.test.cjs
