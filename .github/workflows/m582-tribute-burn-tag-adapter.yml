name: M582 Tribute burn TagDuel adapter
on:
  push:
    branches: [feat/work-m582-tribute-burn-tag-adapter-20261124]
    paths:
      - 'src/tributeBurnTagAdapter.ts'
      - 'tests/tributeBurnTagAdapter.test.cjs'
      - 'docs/evidence/m582-tribute-burn-tag-adapter.json'
      - '.github/workflows/m582-tribute-burn-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/tributeBurnTagAdapter.ts'
      - 'tests/tributeBurnTagAdapter.test.cjs'
      - 'docs/evidence/m582-tribute-burn-tag-adapter.json'
      - '.github/workflows/m582-tribute-burn-tag-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tribute-burn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m582-tribute-burn-tag-adapter.json', 'utf8'))"
      - name: Run M582 behavior regressions
        run: node --test tests/tributeBurnTagAdapter.test.cjs
