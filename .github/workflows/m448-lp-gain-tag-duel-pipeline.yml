name: M448 LP gain TagDuel pipeline
on:
  push:
    branches:
      - feat/work-m448-lp-gain-tag-duel-pipeline-20261121
    paths:
      - 'tests/lpGainTagDuelPipeline.test.cjs'
      - 'docs/evidence/m448-lp-gain-tag-duel-pipeline.json'
      - '.github/workflows/m448-lp-gain-tag-duel-pipeline.yml'
  pull_request:
    paths:
      - 'tests/lpGainTagDuelPipeline.test.cjs'
      - 'docs/evidence/m448-lp-gain-tag-duel-pipeline.json'
      - '.github/workflows/m448-lp-gain-tag-duel-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lp-gain-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Run LP gain pipeline behavior tests
        run: node --test tests/lpGainTagDuelPipeline.test.cjs
