name: M636 Standby LP TagDuel adapter
on:
  push:
    branches:
      - 'feat/work-m636-standby-lp-tag-adapter-20261125'
    paths:
      - 'src/standbyLPGainTagAdapter.ts'
      - 'tests/standbyLPGainTagAdapter.test.cjs'
      - 'docs/evidence/m636-standby-lp-tag-adapter.json'
      - '.github/workflows/m636-standby-lp-tag-adapter.yml'
  pull_request:
    branches:
      - 'feat/rea-engine-recovery-20261026'
      - 'feat/work-*'
    paths:
      - 'src/standbyLPGainTagAdapter.ts'
      - 'tests/standbyLPGainTagAdapter.test.cjs'
      - 'docs/evidence/m636-standby-lp-tag-adapter.json'
      - '.github/workflows/m636-standby-lp-tag-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standby-lp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate factual evidence
        run: node -e "const e=require('./docs/evidence/m636-standby-lp-tag-adapter.json'); if(e.mission!=='M636'||e.adapterBehaviorVerifiedCards!==2||e.behaviorCertifiedCards!==0||e.automaticCertifications!==0||e.inventoryGranted!==0) process.exit(1)"
      - name: Run M636 behavior regressions
        run: node --test tests/standbyLPGainTagAdapter.test.cjs
