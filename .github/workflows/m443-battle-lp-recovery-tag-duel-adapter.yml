name: M443 Battle LP recovery TagDuel adapter
on:
  pull_request:
    paths:
      - 'src/battleLifePointRecoveryTagDuelAdapter.ts'
      - 'tests/battleLifePointRecoveryTagDuelAdapter.test.cjs'
      - 'docs/evidence/m443-battle-lp-recovery-tag-duel-adapter.json'
      - '.github/workflows/m443-battle-lp-recovery-tag-duel-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  battle-lp-tag-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Run battle LP TagDuel adapter behavior tests
        run: node --test tests/battleLifePointRecoveryTagDuelAdapter.test.cjs
