name: M518 8-Claws Scorpion TagDuel Adapter
on:
  push:
    branches:
      - feat/work-m518-eight-claws-scorpion-tag-adapter-20261122
    paths:
      - 'src/eightClawsScorpionTagAdapter.ts'
      - 'tests/eightClawsScorpionTagAdapter.test.cjs'
      - 'docs/evidence/m518-eight-claws-scorpion-tag-adapter.json'
      - '.github/workflows/m518-eight-claws-scorpion-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/eightClawsScorpionTagAdapter.ts'
      - 'tests/eightClawsScorpionTagAdapter.test.cjs'
      - 'docs/evidence/m518-eight-claws-scorpion-tag-adapter.json'
      - '.github/workflows/m518-eight-claws-scorpion-tag-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eight-claws-scorpion-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m518-eight-claws-scorpion-tag-adapter.json', 'utf8'))"
      - name: Run 8-Claws Scorpion adapter behavior tests
        run: node --test tests/eightClawsScorpionTagAdapter.test.cjs
