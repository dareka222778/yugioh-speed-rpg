name: M414 delayed battle destruction focused validation
on:
  pull_request:
    paths:
      - 'src/delayedBattleDestruction.ts'
      - 'tests/delayedBattleDestruction.test.cjs'
      - 'docs/evidence/m414-delayed-battle-destruction.json'
      - '.github/workflows/m414-delayed-battle-destruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/delayedBattleDestruction.test.cjs
