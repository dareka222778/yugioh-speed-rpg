name: M658 Small Monster Destruction TagDuel adapter
on:
  pull_request:
    branches: [feat/rea-engine-recovery-20261026]
    paths:
      - src/smallMonsterDestructionTagAdapter.ts
      - tests/smallMonsterDestructionTagAdapter.test.cjs
      - docs/evidence/m658-small-monster-destruction.json
      - scripts/audit-small-monster-destruction-m658.cjs
      - .github/workflows/m658-small-monster-destruction.yml
  push:
    branches: [feat/work-m658-small-monster-destruction-20261126]
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/smallMonsterDestructionTagAdapter.test.cjs
      - run: node scripts/audit-small-monster-destruction-m658.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m658-small-monster-destruction-evidence
          path: artifacts/m658-small-monster-destruction-results.json
          if-no-files-found: ignore
          retention-days: 14
  repository-regression:
    needs: focused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:tag-classic
