name: M653 dice stat TagDuel adapters
on:
  push:
    branches:
      - feat/work-m653-dice-stat-adapters-20261126
    paths:
      - "src/diceStatTagAdapter.ts"
      - "tests/diceStatTagAdapter.test.cjs"
      - "docs/evidence/m653-dice-stat-adapters.json"
      - ".github/workflows/m653-dice-stat-adapters.yml"
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - "src/diceStatTagAdapter.ts"
      - "tests/diceStatTagAdapter.test.cjs"
      - "docs/evidence/m653-dice-stat-adapters.json"
      - ".github/workflows/m653-dice-stat-adapters.yml"
permissions:
  contents: read
concurrency:
  group: m653-dice-stat-adapters-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/diceStatTagAdapter.test.cjs
      - run: npm test
      - run: npm run audit:tag-classic
      - name: Validate evidence without certifying cards
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('docs/evidence/m653-dice-stat-adapters.json', 'utf8'));
          if (evidence.format !== 1 || evidence.mission !== 'M653') throw new Error('Invalid evidence header');
          if (evidence.cards.length !== 3 || evidence.scenarioCount < 20) throw new Error('Incomplete card/scenario evidence');
          if (evidence.cards.some(card => card.admitted || card.certified)) throw new Error('Adapter CI must not admit or certify cards');
          if (evidence.verification.behaviorCertifiedCards !== 0 || evidence.verification.automaticCertifications !== 0) throw new Error('Adapter CI must not certify cards');
          if (evidence.catalogAtStart.engineV9Certified !== 969 || evidence.catalogAtStart.remaining !== 31) throw new Error('Unexpected certification baseline');
          if (evidence.scope.automaticCertification !== false || evidence.scope.inventoryGranted !== 0) throw new Error('Unsafe side effect recorded');
          console.log('M653 evidence valid; adapter remains outside catalog and inventory.');
          NODE
