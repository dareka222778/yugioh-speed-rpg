name: M578 elemental Spirit TagDuel adapter
on:
  push:
    branches:
      - feat/work-m578-elemental-spirit-tag-adapter-20261123
    paths:
      - 'src/elementalSpiritTagAdapter.ts'
      - 'tests/elementalSpiritTagAdapter.test.cjs'
      - 'docs/evidence/m578-elemental-spirit-tag-adapter.json'
      - '.github/workflows/m578-elemental-spirit-tag-adapter.yml'
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'src/elementalSpiritTagAdapter.ts'
      - 'tests/elementalSpiritTagAdapter.test.cjs'
      - 'docs/evidence/m578-elemental-spirit-tag-adapter.json'
      - '.github/workflows/m578-elemental-spirit-tag-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  elemental-spirit-tag-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate factual evidence
        run: node -e "const e=require('./docs/evidence/m578-elemental-spirit-tag-adapter.json'); if(e.mission!=='M578'||e.behaviorCertifiedCards!==0||e.automaticCertifications!==0) process.exit(1)"
      - name: Run isolated behavioral regressions
        run: node scripts/run-tests-isolated.cjs tests/elementalSpiritTagAdapter.test.cjs
