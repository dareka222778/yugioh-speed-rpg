name: M535 1v1 Invitation Deck Revalidation
on:
  push:
    branches:
      - feat/work-m535-duel-invite-deck-revalidation-20261122
    paths:
      - 'tests/duelInvitationAcceptanceDeckRevalidation.test.cjs'
      - 'docs/evidence/m535-duel-invite-deck-revalidation.json'
      - '.github/workflows/m535-duel-invite-deck-revalidation.yml'
  pull_request:
    paths:
      - 'tests/duelInvitationAcceptanceDeckRevalidation.test.cjs'
      - 'docs/evidence/m535-duel-invite-deck-revalidation.json'
      - '.github/workflows/m535-duel-invite-deck-revalidation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invitation-deck-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m535-duel-invite-deck-revalidation.json', 'utf8'))"
      - name: Run invitation Deck revalidation regression
        run: node --test tests/duelInvitationAcceptanceDeckRevalidation.test.cjs
