name: M469 TagDuel lobby cancel and team concession
on:
  push:
    branches:
      - feat/work-m469-tag-lobby-cancel-confirm-20261121
    paths:
      - 'tests/tagLobbyCancelConfirmDiscord2v2.test.cjs'
      - 'docs/evidence/m469-tag-lobby-cancel-confirm-discord.json'
      - '.github/workflows/m469-tag-lobby-cancel-confirm-discord.yml'
  pull_request:
    paths:
      - 'tests/tagLobbyCancelConfirmDiscord2v2.test.cjs'
      - 'docs/evidence/m469-tag-lobby-cancel-confirm-discord.json'
      - '.github/workflows/m469-tag-lobby-cancel-confirm-discord.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-lobby-cancel-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m469-tag-lobby-cancel-confirm-discord.json', 'utf8'))"
      - name: Run TagDuel lobby cancellation and concession tests
        run: node --test tests/tagLobbyCancelConfirmDiscord2v2.test.cjs
