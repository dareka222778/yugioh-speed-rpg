name: M552 TagDuel Discord Accept Cancel Race
on:
  push:
    branches:
      - feat/work-m552-tag-discord-accept-cancel-race-20261123
    paths:
      - 'tests/tagDiscordAcceptCancelRace.test.cjs'
      - 'docs/evidence/m552-tag-discord-accept-cancel-race.json'
      - '.github/workflows/m552-tag-discord-accept-cancel-race.yml'
  pull_request:
    paths:
      - 'tests/tagDiscordAcceptCancelRace.test.cjs'
      - 'docs/evidence/m552-tag-discord-accept-cancel-race.json'
      - '.github/workflows/m552-tag-discord-accept-cancel-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-discord-accept-cancel-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m552-tag-discord-accept-cancel-race.json', 'utf8'))"
      - name: Run cross-process real Discord handler race
        run: node --test tests/tagDiscordAcceptCancelRace.test.cjs
