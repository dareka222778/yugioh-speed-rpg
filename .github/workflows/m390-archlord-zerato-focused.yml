name: M390 Archlord Zerato focused validation
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'src/archlordZerato.ts'
      - 'tests/archlordZerato.test.cjs'
      - '.github/workflows/m390-archlord-zerato-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archlord-zerato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/archlordZerato.test.cjs
