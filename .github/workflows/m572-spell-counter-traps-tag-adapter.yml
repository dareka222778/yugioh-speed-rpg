name: M572 Spell Counter Traps TagDuel adapter
on:
  push:
    branches: [feat/work-m572-spell-counter-traps-tag-adapter-20261123]
    paths:
      - 'src/spellCounterTrapTagAdapter.ts'
      - 'tests/spellCounterTrapTagAdapter.test.cjs'
      - 'docs/evidence/m572-spell-counter-traps-tag-adapter.json'
      - '.github/workflows/m572-spell-counter-traps-tag-adapter.yml'
  pull_request:
    paths:
      - 'src/spellCounterTrapTagAdapter.ts'
      - 'tests/spellCounterTrapTagAdapter.test.cjs'
      - 'docs/evidence/m572-spell-counter-traps-tag-adapter.json'
      - '.github/workflows/m572-spell-counter-traps-tag-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spell-counter-traps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m572-spell-counter-traps-tag-adapter.json', 'utf8'))"
      - name: Run M572 behavior regressions
        run: node --test tests/spellCounterTrapTagAdapter.test.cjs
