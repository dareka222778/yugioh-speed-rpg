name: M417 position rule family focused validation
on:
  pull_request:
    paths:
      - 'src/positionRulesFamily.ts'
      - 'tests/positionRulesFamily.test.cjs'
      - 'docs/evidence/m417-position-rules.json'
      - '.github/workflows/m417-position-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests/positionRulesFamily.test.cjs
