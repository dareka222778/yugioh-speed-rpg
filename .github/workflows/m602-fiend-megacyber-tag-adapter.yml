name: M602 The Fiend Megacyber conditional hand summon adapter
on:
  push:
    branches:
      - feat/work-m602-fiend-megacyber-conditional-summon-20261124
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/fiendMegacyberTagAdapter.ts
      - tests/fiendMegacyberTagAdapter.test.cjs
      - docs/evidence/m602-fiend-megacyber-tag-adapter.json
      - .github/workflows/m602-fiend-megacyber-tag-adapter.yml
permissions:
  contents: read
jobs:
  fiend-megacyber-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m602-fiend-megacyber-tag-adapter.json', 'utf8'))"
      - run: node --test tests/fiendMegacyberTagAdapter.test.cjs
