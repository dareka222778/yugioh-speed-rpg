name: M375 focused Armed Dragon evolution regressions
on:
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
      - 'feat/work-*'
    paths:
      - 'src/armedDragonEvolution.ts'
      - 'tests/armedDragonEvolution.test.cjs'
      - '.github/workflows/m375-focused-tests.yml'
jobs:
  m375-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests-isolated.cjs tests/armedDragonEvolution.test.cjs
