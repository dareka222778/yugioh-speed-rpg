name: M463 TagDuel separate Field Zone render
on:
  push:
    branches:
      - feat/work-m463-tag-field-zone-separate-render-20261121
    paths:
      - 'tests/tagFieldZoneSeparateRender2v2.test.cjs'
      - 'docs/evidence/m463-tag-field-zone-separate-render.json'
      - '.github/workflows/m463-tag-field-zone-separate-render.yml'
  pull_request:
    paths:
      - 'tests/tagFieldZoneSeparateRender2v2.test.cjs'
      - 'docs/evidence/m463-tag-field-zone-separate-render.json'
      - '.github/workflows/m463-tag-field-zone-separate-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tagduel-field-zone-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate machine-readable evidence JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/evidence/m463-tag-field-zone-separate-render.json', 'utf8'))"
      - name: Run separate Field Zone render matrix
        run: node --test tests/tagFieldZoneSeparateRender2v2.test.cjs
