name: M424 Flip Monster Return Family
on:
  pull_request:
    paths:
      - 'src/flipMonsterReturnFamily.ts'
      - 'tests/flipMonsterReturnFamily.test.cjs'
      - 'docs/evidence/m424-flip-monster-return-family.json'
      - '.github/workflows/m424-flip-monster-return-family.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flip-monster-return:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Run FLIP return behavior tests
        run: node --test tests/flipMonsterReturnFamily.test.cjs
