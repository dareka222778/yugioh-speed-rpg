name: M631 Direct Burn Spell Tag Adapter
on:
  push:
    branches:
      - feat/work-m631-direct-burn-spells-tag-adapter-20261125
    paths:
      - src/directBurnSpellTagAdapter.ts
      - tests/directBurnSpellTagAdapter.test.cjs
      - docs/evidence/m631-direct-burn-spells-tag-adapter.json
      - .github/workflows/m631-direct-burn-spells-tag-adapter.yml
  pull_request:
    branches:
      - feat/rea-engine-recovery-20261026
    paths:
      - src/directBurnSpellTagAdapter.ts
      - tests/directBurnSpellTagAdapter.test.cjs
      - docs/evidence/m631-direct-burn-spells-tag-adapter.json
      - .github/workflows/m631-direct-burn-spells-tag-adapter.yml
permissions:
  contents: read
concurrency:
  group: m631-direct-burn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate evidence metadata
        run: node -e "const e=require('./docs/evidence/m631-direct-burn-spells-tag-adapter.json'); if(e.format!==1 || e.mission!=='M631' || e.cards.length!==2 || e.cards[0].passcode!=='54899807' || e.cards[1].passcode!=='96300057' || e.verification.focusedScenarios!==28 || e.verification.newCertifications!==0 || e.verification.inventoryGranted!==0 || e.production.merge || e.production.deploy) process.exit(1)"
      - run: node --test tests/directBurnSpellTagAdapter.test.cjs
